<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4e78">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Revision">
<title>GCSE Revision</title>
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --text:#1c2430; --muted:#6b7684; --line:#e3e6eb;
  --accent:#1f4e78; --accent-2:#e8f0f8;
  --red:#d64545; --red-bg:#fbe7e7; --amber:#d99a1e; --amber-bg:#fdf1d8; --green:#2e9b5f; --green-bg:#e2f4ea; --none:#cfd5dd;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#11151a; --card:#1b2129; --text:#e7ebf0; --muted:#98a3b0; --line:#2c343e;
    --accent:#7fb0e0; --accent-2:#1f2c3a;
    --red:#ef6b6b; --red-bg:#3a2224; --amber:#f0b64a; --amber-bg:#3a3020; --green:#4cc585; --green-bg:#1d3326; --none:#3a434e;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.4}
button{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--accent);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 0}
@media (prefers-color-scheme: dark){header{background:#16324d}}
header h1{margin:0 0 8px;font-size:18px;font-weight:700}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:0;border-radius:999px;padding:7px 14px;background:rgba(255,255,255,.15);color:#fff;font-size:14px;font-weight:600;cursor:pointer}
nav button.on{background:#fff;color:#1f4e78}
main{max-width:720px;margin:0 auto;padding:16px 16px calc(env(safe-area-inset-bottom) + 40px)}
h2{font-size:20px;margin:4px 0 12px}
h3{font-size:15px;margin:0}
.muted{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;flex:0 0 auto}
.session{display:flex;align-items:flex-start;gap:12px}
.session .body{flex:1;min-width:0}
.session .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.session .mins{font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap}
.check{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);background:transparent;flex:0 0 auto;cursor:pointer;display:grid;place-items:center;margin-top:1px}
.check.on{background:var(--green);border-color:var(--green);color:#fff}
.session.done .subj{text-decoration:line-through;color:var(--muted)}
.focus{margin:8px 0 0;padding:0;list-style:none}
.focus li{font-size:14px;padding:3px 0;display:flex;gap:6px}
.focus li::before{content:"→";color:var(--muted)}
.link{border:0;background:none;color:var(--accent);font-weight:600;font-size:14px;padding:6px 0 0;cursor:pointer}
.free{text-align:center;padding:28px 14px}
.free .big{font-size:36px}
.day{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.day.today h3::after{content:"Today";margin-left:8px;font-size:11px;font-weight:700;background:var(--accent-2);color:var(--accent);padding:2px 8px;border-radius:999px;vertical-align:middle}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;font-size:13px;padding:4px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.chip .dot{width:8px;height:8px;margin-right:6px}
.bar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--none);margin:10px 0 8px}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted)}
.legend b{color:var(--text)}
.filters{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
.filters button.on{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){.filters button.on{color:#11151a}}
details.group{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
details.group>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700}
details.group>summary::-webkit-details-marker{display:none}
details.group>summary>span:first-child{flex:1}
details.group>summary .count{font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}
details.group>summary::after{content:"›";font-size:20px;color:var(--muted);transition:transform .15s}
details.group[open]>summary::after{transform:rotate(90deg)}
.sub{padding:8px 14px 2px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border-top:1px solid var(--line)}
.item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.sub+.item{border-top:0}
.item .t{flex:1;min-width:0;font-size:15px}
.rag{display:flex;gap:5px;flex:0 0 auto}
.rag button{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:transparent;font-size:13px;font-weight:800;cursor:pointer;color:var(--muted)}
.rag button.r.on{background:var(--red);border-color:var(--red);color:#fff}
.rag button.a.on{background:var(--amber);border-color:var(--amber);color:#fff}
.rag button.g.on{background:var(--green);border-color:var(--green);color:#fff}
.item.r{background:var(--red-bg)} .item.a{background:var(--amber-bg)} .item.g{background:var(--green-bg)}
.empty{padding:20px;text-align:center;color:var(--muted)}
.btn{display:block;width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;font-weight:700;margin-top:8px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){.btn.primary{color:#11151a}}
.btn.danger{color:var(--red)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:.95}
</style>
</head>

const COLOURS = {Maths:"#3b7dd8",English:"#e0664f",Biology:"#3ea66b",Chemistry:"#8e5cc4",Physics:"#2aa4b8",
  French:"#e0a526",Geography:"#b4674a",Music:"#cc4f8d","Sports Studies":"#5d9e3a"};
const DAYNAMES = {Mon:"Monday",Tue:"Tuesday",Wed:"Wednesday",Thu:"Thursday",Fri:"Friday",Sat:"Saturday",Sun:"Sunday"};
const JS_DAY = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const KEY = "gcse-revision-v1";
const SUBJECTS = Object.keys(DATA.subjects);
const TABS = ["Today","Week",...SUBJECTS,"Backup"];

let state = {ratings:{}, done:{}};
let memoryOnly = false;
function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw){ const s = JSON.parse(raw); state = {ratings:s.ratings||{}, done:s.done||{}}; } }
  catch(e){ memoryOnly = true; }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ if(!memoryOnly){ memoryOnly = true; toast("This browser can't save – use Export to keep your progress"); } }
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const idOf = (subj, it) => subj + "|" + it.join("|");
const todayKey = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const hm = m => { const h = Math.floor(m/60), r = m%60; return h ? (h+"h"+(r?" "+String(r).padStart(2,"0")+"m":"")) : r+"m"; };
function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), 2400); }

function counts(subj){
  const c = {r:0,a:0,g:0,n:0};
  for(const it of DATA.subjects[subj].items){ const v = state.ratings[idOf(subj,it)]; c[v||"n"]++; }
  return c;
}
function barHTML(c){
  const tot = c.r+c.a+c.g+c.n || 1;
  const seg = (n,col) => n ? `<span style="width:${n/tot*100}%;background:var(${col})"></span>` : "";
  return `<div class="bar">${seg(c.g,"--green")}${seg(c.a,"--amber")}${seg(c.r,"--red")}</div>
  <div class="legend"><span><b>${c.g}</b> green</span><span><b>${c.a}</b> amber</span><span><b>${c.r}</b> red</span><span><b>${c.n}</b> not rated</span></div>`;
}
function focusItems(subj, n){
  const items = DATA.subjects[subj]?.items || [];
  const pick = v => items.filter(it => (state.ratings[idOf(subj,it)]||"n") === v);
  return [...pick("r"), ...pick("a"), ...pick("n")].slice(0,n);
}

let current = "Today";
let filter = "all";
function setTab(t){
  current = TABS.includes(t) ? t : "Today";
  filter = "all";
  try{ history.replaceState(null,"","#"+encodeURIComponent(current)); }catch(e){}
  render();
  window.scrollTo(0,0);
  const b = document.querySelector(`nav button[data-t="${CSS.escape(current)}"]`);
  if(b) b.scrollIntoView({inline:"center",block:"nearest"});
}
function renderTabs(){
  document.getElementById("tabs").innerHTML = TABS.map(t =>
    `<button data-t="${esc(t)}" class="${t===current?"on":""}">${esc(t)}</button>`).join("");
}

function viewToday(){
  const dn = JS_DAY[new Date().getDay()];
  const day = DATA.days.find(d => d[0]===dn);
  const sessions = day ? day[1] : [];
  const tk = todayKey();
  let h = `<h2>${DAYNAMES[dn]}</h2>`;
  if(!sessions.length){
    return h + `<div class="card free"><div class="big">🎉</div><h3>No revision today</h3><p class="muted">Enjoy the day off.</p></div>`;
  }
  const total = sessions.reduce((a,s)=>a+s[1],0);
  const doneN = sessions.filter((s,i)=>state.done[tk+"|"+i]).length;
  h += `<p class="muted" style="margin-top:-6px">${sessions.length} sessions · ${hm(total)} · ${doneN} done</p>`;
  sessions.forEach(([subj,mins],i)=>{
    const done = !!state.done[tk+"|"+i];
    const f = done ? [] : focusItems(subj,3);
    const has = !!DATA.subjects[subj];
    h += `<div class="card session ${done?"done":""}">
      <button class="check ${done?"on":""}" data-done="${i}" aria-label="Mark ${esc(subj)} done">${done?"✓":""}</button>
      <div class="body">
        <div class="top"><h3 class="subj"><span class="dot" style="background:${COLOURS[subj]||"#888"}"></span>${esc(subj)}</h3><span class="mins">${mins} min</span></div>
        ${f.length ? `<ul class="focus">${f.map(it=>`<li>${esc(it[2])}</li>`).join("")}</ul>` : ""}
        ${has && !done ? `<button class="link" data-go="${esc(subj)}">Open ${esc(subj)} tracker</button>` : ""}
      </div></div>`;
  });
  return h;
}

function viewWeek(){
  const dn = JS_DAY[new Date().getDay()];
  let h = `<h2>Weekly timetable</h2>`;
  let wk = 0;
  for(const [d,ss] of DATA.days){
    const tot = ss.reduce((a,s)=>a+s[1],0); wk += tot;
    h += `<div class="card"><div class="day ${d===dn?"today":""}"><h3>${DAYNAMES[d]}</h3><span class="muted">${tot?hm(tot):"Free"}</span></div>
      ${ss.length ? `<div class="chips">${ss.map(([s,m])=>`<span class="chip"><span class="dot" style="background:${COLOURS[s]||"#888"}"></span>${esc(s)} · ${m}m</span>`).join("")}</div>` : `<span class="muted">Free day</span>`}
    </div>`;
  }
  const per = {};
  DATA.days.forEach(([,ss])=>ss.forEach(([s,m])=>per[s]=(per[s]||0)+m));
  h += `<div class="card"><div class="day"><h3>Weekly totals</h3><span class="muted">${hm(wk)}</span></div><div class="chips">${
    Object.entries(per).map(([s,m])=>`<span class="chip"><span class="dot" style="background:${COLOURS[s]||"#888"}"></span>${esc(s)} · ${hm(m)}</span>`).join("")}</div></div>`;
  return h;
}

function viewSubject(subj){
  const S = DATA.subjects[subj];
  const c = counts(subj);
  let h = `<h2><span class="dot" style="background:${COLOURS[subj]}"></span>${esc(subj)}</h2>
    <div class="card"><div class="muted">${esc(S.title)}</div>${barHTML(c)}</div>`;
  const fl = [["all","All"],["r","Red"],["a","Amber"],["g","Green"],["n","Not rated"]];
  h += `<div class="filters">${fl.map(([k,l])=>`<button data-f="${k}" class="${filter===k?"on":""}">${l}</button>`).join("")}</div>`;
  const groups = [];
  for(const it of S.items){
    let g = groups.find(x=>x.name===it[0]);
    if(!g){ g = {name:it[0], items:[]}; groups.push(g); }
    g.items.push(it);
  }
  let shown = 0;
  for(const g of groups){
    const vis = g.items.filter(it => filter==="all" || (state.ratings[idOf(subj,it)]||"n")===filter);
    if(!vis.length) continue;
    shown += vis.length;
    const gc = g.items.filter(it=>state.ratings[idOf(subj,it)]==="g").length;
    const open = filter!=="all" || groups.length<=2 ? "open" : "";
    let inner = "", lastSub = null;
    for(const it of vis){
      if(it[1] && it[1]!==lastSub){ inner += `<div class="sub">${esc(it[1])}</div>`; lastSub = it[1]; }
      const id = idOf(subj,it), v = state.ratings[id]||"";
      inner += `<div class="item ${v}" data-id="${esc(id)}"><div class="t">${esc(it[2])}</div>
        <div class="rag"><button class="r ${v==="r"?"on":""}" data-v="r" aria-label="Red">R</button><button class="a ${v==="a"?"on":""}" data-v="a" aria-label="Amber">A</button><button class="g ${v==="g"?"on":""}" data-v="g" aria-label="Green">G</button></div></div>`;
    }
    h += `<details class="group" data-g="${esc(g.name)}" ${open}><summary><span>${esc(g.name)}</span><span class="count">${gc}/${g.items.length} green</span></summary>${inner}</details>`;
  }
  if(!shown) h += `<div class="card empty">Nothing here yet.</div>`;
  return h;
}

function viewBackup(){
  let h = `<h2>Backup</h2>
  <div class="card"><p style="margin-top:0">Your ratings and ticks are saved in this browser on this device. Export a backup now and then, so clearing browser data doesn't wipe your progress. You can also use Export and Import to move progress to another device.</p>
  <button class="btn primary" id="exportBtn">Export progress</button>
  <button class="btn" id="importBtn">Import progress</button></div>`;
  let all = {r:0,a:0,g:0,n:0};
  h += `<div class="card"><h3>Overall progress</h3>`;
  for(const s of SUBJECTS){
    const c = counts(s); for(const k in c) all[k]+=c[k];
    h += `<div style="margin-top:12px"><div class="day" style="margin:0"><span><span class="dot" style="background:${COLOURS[s]}"></span>${esc(s)}</span><span class="muted">${c.g}/${c.r+c.a+c.g+c.n} green</span></div>${barHTML(c).split('<div class="legend">')[0]}</div>`;
  }
  h += `</div><div class="card"><button class="btn danger" id="resetBtn" style="margin-top:0">Reset all progress</button></div>`;
  return h;
}

function render(){
  renderTabs();
  const v = document.getElementById("view");
  const openGroups = new Set([...v.querySelectorAll("details.group[open]")].map(d=>d.dataset.g));
  if(current==="Today") v.innerHTML = viewToday();
  else if(current==="Week") v.innerHTML = viewWeek();
  else if(current==="Backup") v.innerHTML = viewBackup();
  else {
    v.innerHTML = viewSubject(current);
    if(render._keep) v.querySelectorAll("details.group").forEach(d=>{ if(openGroups.has(d.dataset.g)) d.open = true; });
  }
  render._keep = false;
}

document.getElementById("tabs").addEventListener("click", e => { const b = e.target.closest("button[data-t]"); if(b) setTab(b.dataset.t); });
document.getElementById("view").addEventListener("click", e => {
  const go = e.target.closest("[data-go]"); if(go){ setTab(go.dataset.go); return; }
  const dn = e.target.closest("[data-done]");
  if(dn){ const k = todayKey()+"|"+dn.dataset.done; if(state.done[k]) delete state.done[k]; else state.done[k]=true; save(); render(); return; }
  const f = e.target.closest("[data-f]"); if(f){ filter = f.dataset.f; render(); return; }
  const rb = e.target.closest(".rag button");
  if(rb){
    const id = rb.closest(".item").dataset.id, v = rb.dataset.v;
    if(state.ratings[id]===v) delete state.ratings[id]; else state.ratings[id]=v;
    save(); const y = window.scrollY; render._keep = true; render(); window.scrollTo(0,y); return;
  }
  if(e.target.id==="exportBtn"){
    const blob = new Blob([JSON.stringify({app:"gcse-revision",version:1,exported:new Date().toISOString(),...state},null,1)],{type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "gcse-revision-backup-"+todayKey()+".json";
    document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
    toast("Backup downloaded");
  }
  if(e.target.id==="importBtn") document.getElementById("importFile").click();
  if(e.target.id==="resetBtn" && confirm("Clear all ratings and ticks? This can't be undone unless you have a backup.")){
    state = {ratings:{},done:{}}; save(); render(); toast("Progress reset");
  }
});
document.getElementById("importFile").addEventListener("change", e => {
  const file = e.target.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const s = JSON.parse(r.result);
      if(typeof s.ratings!=="object") throw 0;
      state = {ratings:s.ratings||{}, done:s.done||{}}; save(); render(); toast("Progress imported");
    }catch(err){ toast("That file isn't a valid backup"); }
    e.target.value = "";
  };
  r.readAsText(file);
});

load();
setTab(decodeURIComponent(location.hash.slice(1)) || "Today");
</script>
</body>
</html>
